map $http_upgrade $kcml_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=kcml_login:10m rate=12r/m;

server {
  listen 80;
  listen [::]:80;
  server_name kaja.hcasc.cz *.kaja.hcasc.cz;
  location /.well-known/acme-challenge/ { root /var/lib/kajovocml-ng/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name kaja.hcasc.cz *.kaja.hcasc.cz;
  ssl_certificate /etc/kajovocml-ng/tls/fullchain.pem;
  ssl_certificate_key /etc/kajovocml-ng/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:KCMLTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  client_max_body_size 32m;

  location = /api/v1/auth/login { limit_req zone=kcml_login burst=4 nodelay; proxy_pass http://unix:/run/kajovocml-ng/web-api.sock; include proxy_params; }
  location /api/v1/events { proxy_pass http://unix:/run/kajovocml-ng/web-api.sock; include proxy_params; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no; }
  location /api/v1/browser/preview { proxy_pass http://unix:/run/kajovocml-ng/web-api.sock; include proxy_params; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $kcml_connection_upgrade; proxy_buffering off; }
  location / { proxy_pass http://unix:/run/kajovocml-ng/web-api.sock; include proxy_params; proxy_http_version 1.1; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; }
}
