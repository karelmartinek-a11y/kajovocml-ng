name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kcml
          POSTGRES_PASSWORD: kcml-ci-password
          POSTGRES_DB: kajovocml_ng
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kcml -d kajovocml_ng"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://kcml:kcml-ci-password@127.0.0.1:5432/kajovocml_ng
      KCML_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      KCML_RELEASE_ID: ci
      KCML_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.11.1', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm conformance:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:contracts
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm test:postgres
      - run: pnpm test:integration
      - run: pnpm test:property
      - run: pnpm test:chaos
      - run: pnpm test:ipc
      - run: pnpm test:systemd
      - run: bash scripts/repository-consistency.sh
