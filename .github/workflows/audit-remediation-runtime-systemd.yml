name: Audit remediation runtime systemd lifecycle
on:
  push:
    branches: [audit-remediation-2026-09-06]
    paths: ['.github/workflows/audit-remediation-runtime-systemd.yml']
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-2026-09-06
          fetch-depth: 0
      - name: Apply runtime lifecycle and authority patches
        shell: bash
        run: |
          cp .audit/runtime-systemd.patch /tmp/runtime-systemd.patch
          sed -i \
            -e 's|^--- a/packages/worker-runtime/src/runtime-systemd.ts$|--- /dev/null|' \
            -e 's|^--- a/deploy/polkit/50-kcml-runtime-gateway.rules$|--- /dev/null|' \
            -e 's|^--- a/tests/runtime-boundary/runtime-systemd.test.ts$|--- /dev/null|' \
            -e 's|^@@ -0,0 +1,11 @@$|@@ -0,0 +1,10 @@|' \
            -e 's|^@@ -0,0 +1,24 @@$|@@ -0,0 +1,18 @@|' \
            /tmp/runtime-systemd.patch
          git apply --check --verbose /tmp/runtime-systemd.patch
          git apply /tmp/runtime-systemd.patch
          git apply --check --verbose .audit/runtime-systemd-authority.patch
          git apply .audit/runtime-systemd-authority.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/worker-runtime/src/index.ts')
          s=p.read_text()
          old="  const worker = options.queueNames && catalog ? new CanonicalCommandWorker(pool, catalog, { queueNames: options.queueNames, allowedOperations, workerId: instanceId, specialistExecutor }) : null;"
          new="  const worker = options.queueNames && catalog ? new CanonicalCommandWorker(pool, catalog, { queueNames: options.queueNames, allowedOperations, workerId: instanceId, ...(specialistExecutor ? { specialistExecutor } : {}) }) : null;"
          if old not in s:
            raise SystemExit('worker option insertion point missing')
          p.write_text(s.replace(old,new))
          PY
          rm -f \
            .audit/runtime-systemd.patch \
            .audit/runtime-systemd-authority.patch \
            .audit/runtime-systemd-apply.txt \
            .audit/runtime-systemd-verify.txt \
            .github/workflows/audit-remediation-runtime-systemd.yml
      - name: Register trace coverage for new runtime artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('contracts/traceability/artifact-trace-source-remediation.json')
          data=json.loads(p.read_text())
          records=data['records']
          paths={r['repositoryPath'] for r in records}
          operations=json.loads(Path('contracts/registries/operations/operations.json').read_text())['records']
          runtime_ops=[r['operationId'] for r in operations if r['operationName'].startswith('runtime.')]
          additions=[
            {
              'repositoryPath':'packages/worker-runtime/src/runtime-systemd.ts',
              'requirementIds':['KCML-REQ-CORE-d920c29b8d4c55af170389ba35b01410906821f2f92f912c1b1f520dd3e35531','KCML-REQ-CORE-302243efb9970f11308337865ddf7a4fe5e09626545681cedbca054d6f47ebcf','KCML-REQ-CORE-4335ee3693ec80d29052766ff4be4346eb56980881362b237438877efe7957ac','KCML-REQ-CORE-d36540fb4c24dde9134961a35ba4c6a464ee47842444cb8cadda21e27b855838'],
              'operationIds':runtime_ops,'stateMachineIds':['SM-RUNTIME_INSTANCE'],'registryRecordIds':['RUNTIME_INSTANCE'],'testIds':['TEST_CASE:tests/runtime-boundary/runtime-systemd.test.ts#runtime-systemd-lifecycle'],'releaseIds':[],'traceAnchors':[]
            },
            {
              'repositoryPath':'packages/domain/src/side-effect-ledger.ts',
              'requirementIds':['KCML-REQ-CORE-dfcc2e9b79b514c989582e212cb3c54ef062c9d7638eb9e22c7b4bd4d54cb538','KCML-REQ-POSTGRES-484568bff710d5d709e24cc3c81026a541a823f100b6358d7936bc062fdf3a03','KCML-REQ-SECURITY-f07c9a01244d2b0b0e2afcd6fcd96bd7ce0f0b27a4c35ae461bafe9a327e58ea'],
              'operationIds':[],'stateMachineIds':['SM-SIDE_EFFECT'],'registryRecordIds':['SIDE_EFFECT_LEDGER'],'testIds':[],'releaseIds':[],'traceAnchors':[]
            },
            {
              'repositoryPath':'deploy/polkit/50-kcml-runtime-gateway.rules',
              'requirementIds':['KCML-REQ-CORE-f2cae71be4db407111d74c18fc3871acee69af4cab41e945d48a780900f88581','KCML-REQ-CORE-621158d112946ef801b50e0d3d038eda3b90ddb2190b4fafacfbc90d1da4d81a'],
              'operationIds':[],'stateMachineIds':[],'registryRecordIds':[],'testIds':[],'releaseIds':[],'traceAnchors':[]
            },
            {
              'repositoryPath':'tests/runtime-boundary/runtime-systemd.test.ts',
              'requirementIds':['KCML-REQ-CORE-d920c29b8d4c55af170389ba35b01410906821f2f92f912c1b1f520dd3e35531','KCML-REQ-CORE-302243efb9970f11308337865ddf7a4fe5e09626545681cedbca054d6f47ebcf'],
              'operationIds':runtime_ops,'stateMachineIds':['SM-RUNTIME_INSTANCE'],'registryRecordIds':['RUNTIME_INSTANCE'],'testIds':['TEST_CASE:tests/runtime-boundary/runtime-systemd.test.ts#runtime-systemd-lifecycle'],'releaseIds':[],'traceAnchors':[]
            }
          ]
          for record in additions:
            if record['repositoryPath'] not in paths:
              records.append(record)
          records.sort(key=lambda record:record['repositoryPath'])
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate implementation trace evidence
        run: pnpm contracts:build
      - name: Verify runtime systemd lifecycle
        shell: bash
        run: |
          set +e
          : > /tmp/runtime-systemd-verify.txt
          for command in \
            "pnpm contracts:check" \
            "pnpm lint" \
            "pnpm typecheck" \
            "pnpm exec vitest run tests/runtime-boundary/runtime-systemd.test.ts tests/runtime-boundary/ipc-multiplex.test.ts tests/runtime-boundary/matrix.test.ts" \
            "pnpm --filter @kcml/domain build" \
            "pnpm --filter @kcml/worker-runtime build" \
            "git diff --check"
          do
            printf '\n===== %s =====\n' "$command" | tee -a /tmp/runtime-systemd-verify.txt
            bash -lc "$command" 2>&1 | tee -a /tmp/runtime-systemd-verify.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              mkdir -p .audit
              cp /tmp/runtime-systemd-verify.txt .audit/runtime-systemd-verify.txt
              git config user.name 'openai-remediation-bot'
              git config user.email 'openai-remediation-bot@users.noreply.github.com'
              git add -f .audit/runtime-systemd-verify.txt
              git commit -m 'chore(audit): capture runtime systemd validation failure'
              git push origin HEAD:audit-remediation-2026-09-06
              exit "$status"
            fi
          done
      - name: Commit verified remediation
        run: |
          git add -A
          git config user.name 'openai-remediation-bot'
          git config user.email 'openai-remediation-bot@users.noreply.github.com'
          git commit -m 'fix(runtime): execute lifecycle through guarded systemd readback'
          git push origin HEAD:audit-remediation-2026-09-06
