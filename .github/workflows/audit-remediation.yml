name: Audit remediation batch three
on:
  push:
    branches: [audit-remediation-2026-09-06]
permissions:
  contents: write
concurrency:
  group: audit-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit-remediation-2026-09-06
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Apply provenance authority and derivation remediation
        run: python3 scripts/audit-remediation-batch3.py
      - name: Enforce mandatory source digest without fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/domain/src/exact-operation-handlers.ts')
          text = path.read_text(encoding='utf-8')
          old = "  const suppliedSourceDigest = digestArgument(context, 'sourceDigest');"
          new = """  if (typeof context.arguments.sourceDigest !== 'string' || !/^sha256:[0-9a-f]{64}$/iu.test(context.arguments.sourceDigest)) throw new DomainError('TOOL_ARGUMENT_SCHEMA_INVALID', 'sourceDigest must be a sha256 digest', 422, 'DO_NOT_RETRY', { key: 'sourceDigest' });
  const suppliedSourceDigest = digestArgument(context, 'sourceDigest', {});"""
          if old not in text:
              raise SystemExit('sourceDigest call marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify SSOT surface and registries
        run: node scripts/compile-ssot-surface.mjs --check && node scripts/verify-authority-ownership.mjs && node scripts/verify-error-codes.mjs
      - name: Verify lint
        run: pnpm lint
      - name: Verify types
        run: pnpm typecheck
      - name: Verify workspace build
        run: pnpm -r --sort --if-present build
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit verified provenance remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src/exact-operation-handlers.ts
          if git diff --cached --quiet; then
            echo 'No provenance changes.'
            exit 0
          fi
          git commit -m 'fix(security): derive provenance authority and values server-side'
          git push origin HEAD:audit-remediation-2026-09-06
