name: Audit remediation batch five
on:
  push:
    branches: [audit-remediation-2026-09-06]
permissions:
  contents: write
concurrency:
  group: audit-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit-remediation-2026-09-06
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Apply ordered outbox remediation
        run: python3 scripts/audit-remediation-batch5.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify SSOT surface and registries
        run: node scripts/compile-ssot-surface.mjs --check && node scripts/verify-authority-ownership.mjs && node scripts/verify-error-codes.mjs
      - name: Verify lint
        run: pnpm lint
      - name: Verify types
        run: pnpm typecheck
      - name: Verify workspace build
        run: pnpm -r --sort --if-present build
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit verified outbox remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/worker-runtime/src/index.ts packages/worker-runtime/src/outbox-delivery.ts
          if git diff --cached --quiet; then
            echo 'No outbox remediation changes.'
            exit 0
          fi
          git commit -m 'fix(queue): deliver ordered transactional outbox with inbox dedupe'
          git push origin HEAD:audit-remediation-2026-09-06
