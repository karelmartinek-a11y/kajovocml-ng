name: Audit remediation verification
on:
  push:
    branches: [audit-remediation-2026-09-06]
permissions:
  contents: read
concurrency:
  group: audit-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify SSOT surface and registries
        run: node scripts/compile-ssot-surface.mjs --check && node scripts/verify-authority-ownership.mjs && node scripts/verify-error-codes.mjs
      - name: Verify lint
        run: pnpm lint
      - name: Verify types
        run: pnpm typecheck
      - name: Verify workspace build
        run: pnpm -r --sort --if-present build
      - name: Verify patch whitespace
        run: git diff --check
