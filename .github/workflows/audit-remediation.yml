name: Audit remediation trace normalization
on:
  push:
    branches: [audit-remediation-2026-09-06]
permissions:
  contents: write
concurrency:
  group: audit-remediation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit-remediation-2026-09-06
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Regenerate implementation evidence
        run: node scripts/compile-contract-trace.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify full authority and evidence
        run: pnpm contracts:check
      - name: Verify lint
        run: pnpm lint
      - name: Verify types
        run: pnpm typecheck
      - name: Verify root build
        run: pnpm build
      - name: Verify conformance audit
        run: pnpm conformance:audit
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit normalized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/traceability/artifact-trace
          git commit -m 'fix(contracts): normalize implementation evidence after authority split'
          git push origin HEAD:audit-remediation-2026-09-06
