name: Audit remediation runtime foundation
on:
  push:
    branches: [audit-remediation-2026-09-06]
    paths: ['.github/workflows/audit-remediation-runtime-foundation.yml']
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-2026-09-06
          fetch-depth: 0
      - name: Apply runtime foundation patch
        run: |
          git apply --check .audit/runtime-foundation.patch
          git apply .audit/runtime-foundation.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install toolchain
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Regenerate implementation trace evidence
        run: pnpm contracts:build
      - name: Verify and capture diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/runtime-foundation-verify.log
          for command in \
            "pnpm contracts:check" \
            "pnpm lint" \
            "pnpm typecheck" \
            "pnpm exec vitest run tests/runtime-boundary/ipc-multiplex.test.ts"
          do
            printf '\n===== %s =====\n' "$command" | tee -a /tmp/runtime-foundation-verify.log
            bash -lc "$command" 2>&1 | tee -a /tmp/runtime-foundation-verify.log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              mkdir -p .audit
              cp /tmp/runtime-foundation-verify.log .audit/runtime-foundation-verify.log
              git config user.name 'openai-remediation-bot'
              git config user.email 'openai-remediation-bot@users.noreply.github.com'
              git add .audit/runtime-foundation-verify.log
              git commit -m 'chore(audit): capture runtime foundation validation failure'
              git push origin HEAD:audit-remediation-2026-09-06
              exit "$status"
            fi
          done
      - name: Commit verified remediation
        run: |
          rm -f .github/workflows/audit-remediation-runtime-foundation.yml .audit/runtime-foundation.patch .audit/runtime-foundation-verify.log
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'openai-remediation-bot'
          git config user.email 'openai-remediation-bot@users.noreply.github.com'
          git commit -m 'fix(runtime): add fenced specialist execution boundary'
          git push origin HEAD:audit-remediation-2026-09-06
