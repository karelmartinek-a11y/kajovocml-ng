name: Audit remediation runtime foundation
on:
  push:
    branches: [audit-remediation-2026-09-06]
    paths: ['.github/workflows/audit-remediation-runtime-foundation.yml']
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-2026-09-06
          fetch-depth: 0
      - name: Apply runtime foundation patch and remove staging artifacts
        run: |
          git apply --check .audit/runtime-foundation.patch
          git apply .audit/runtime-foundation.patch
          rm -f .audit/runtime-foundation.patch .audit/runtime-foundation-verify.txt .github/workflows/audit-remediation-runtime-foundation.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install toolchain
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Regenerate implementation trace evidence
        run: pnpm contracts:build
      - name: Verify runtime foundation
        run: |
          pnpm contracts:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run tests/runtime-boundary/ipc-multiplex.test.ts
      - name: Commit verified remediation
        run: |
          git add -A
          git config user.name 'openai-remediation-bot'
          git config user.email 'openai-remediation-bot@users.noreply.github.com'
          git commit -m 'fix(runtime): add fenced specialist execution boundary'
          git pull --rebase origin audit-remediation-2026-09-06
          git push origin HEAD:audit-remediation-2026-09-06
