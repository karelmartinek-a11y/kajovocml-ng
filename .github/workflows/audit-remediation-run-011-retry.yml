name: Audit remediation RUN-011 retry
on:
  push:
    branches: [audit-remediation-2026-09-06]
    paths: ['.github/workflows/audit-remediation-run-011-retry.yml']
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-2026-09-06
          fetch-depth: 0
      - name: Apply runtime wiring, trace and writer authority after allocator repair
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          import json, textwrap
          workflow=Path('.github/workflows/audit-remediation-run-011.yml').read_text()
          body=workflow.split("          python3 - <<'PY'\n",1)[1].split("\n          PY\n",1)[0]
          exec(textwrap.dedent(body), {'__name__':'__main__'})

          trace_path=Path('contracts/traceability/artifact-trace-source-remediation.json')
          trace=json.loads(trace_path.read_text())
          by_path={record['repositoryPath']:record for record in trace['records']}
          gateway_requirements=[
            'KCML-REQ-RUNTIME-0d17f0e65a367a483368d5830d2274c348c944ca77d8d9803a8ae5d618453e94',
            'KCML-REQ-RUNTIME-42568b370bf765d08149a68238c64a9be156058c9ec112370059c945e85d572b',
            'KCML-REQ-RUNTIME-5866f4abf3ff73dab1460b4c4423cd439c97c079f6d0d7a9c7ca00d35bf83fa5',
            'KCML-REQ-RUNTIME-5c14e96e7f102d70bf612ab9dce896f7f38aa62adcd5f93d6eb4004a7bdb5358',
            'KCML-REQ-RUNTIME-e3825ab35ac76cbdc656fd65c5587e6ac1478796d63e489bff8fe621a3fce13d',
            'KCML-REQ-RUNTIME-ec3520fc4788b2aded645d6a29c431c9d611f5a2acd7422eb9b5ab0c54edea8a'
          ]
          test_requirements=[
            'KCML-REQ-RUNTIME-42568b370bf765d08149a68238c64a9be156058c9ec112370059c945e85d572b',
            'KCML-REQ-RUNTIME-5866f4abf3ff73dab1460b4c4423cd439c97c079f6d0d7a9c7ca00d35bf83fa5',
            'KCML-REQ-RUNTIME-9d367700d6eeb2c0a7f10b71f5f29c32745f4d50ae5b5872b19825acc91d6ad8',
            'KCML-REQ-RUNTIME-b66b9a9e0dee01320d8a866011edc5e5a787347ad35a16cd276d4e15a1d561f9',
            'KCML-REQ-RUNTIME-db74ee6d319c31d8bd8147a91b7160cb8eff9a88c501323b8cf85b967fb8fcfc'
          ]
          operations=['OP-RUNTIME-BOUNDARY-VERIFY','OP-RUNTIME-CONNECTION-INSPECT','OP-RUNTIME-HEARTBEAT','OP-RUNTIME-READY-REPORT','OP-RUNTIME-STATE-REPORT']
          records=[
            {
              'repositoryPath':'packages/worker-runtime/src/runtime-gateway.ts',
              'requirementIds':gateway_requirements,
              'operationIds':operations,
              'stateMachineIds':['SM-RUNTIME_INSTANCE'],
              'registryRecordIds':['RUNTIME_INSTANCE'],
              'testIds':['TEST_CASE:tests/runtime-boundary/runtime-gateway.test.ts#runtime-gateway-identity'],
              'releaseIds':[],
              'traceAnchors':[]
            },
            {
              'repositoryPath':'tests/runtime-boundary/runtime-gateway.test.ts',
              'requirementIds':test_requirements,
              'operationIds':operations,
              'stateMachineIds':['SM-RUNTIME_INSTANCE'],
              'registryRecordIds':['RUNTIME_INSTANCE'],
              'testIds':['TEST_CASE:tests/runtime-boundary/runtime-gateway.test.ts#runtime-gateway-identity'],
              'releaseIds':[],
              'traceAnchors':[]
            }
          ]
          for record in records:
            if record['repositoryPath'] in by_path:
              by_path[record['repositoryPath']].update(record)
            else:
              trace['records'].append(record)
          trace['records'].sort(key=lambda item:item['repositoryPath'])
          trace_path.write_text(json.dumps(trace,separators=(',',':'))+'\n')

          writer_path=Path('scripts/lib/authority-writer-audit.mjs')
          writer=writer_path.read_text()
          anchor="  ['packages/worker-runtime/src/runtime-systemd.ts', 'WRITER-RUNTIME'],\n"
          addition="  ['packages/worker-runtime/src/runtime-gateway.ts', 'WRITER-RUNTIME'],\n"
          if addition not in writer:
            if anchor not in writer: raise SystemExit('runtime writer authority anchor missing')
            writer=writer.replace(anchor, anchor+addition)
          writer_path.write_text(writer)
          PYEXTRACT
          rm -f .github/workflows/audit-remediation-run-011.yml .github/workflows/audit-remediation-run-011-retry.yml .audit/run011-verify.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile trusted native FD boundary
        shell: bash
        run: |
          node_root=$(dirname "$(dirname "$(command -v node)")")
          node_include="${node_root}/include/node"
          test -f "${node_include}/node_api.h"
          cc -O2 -Wall -Wextra -Werror -fPIC -shared -I"${node_include}" deploy/runtime/kcml-fd-cloexec-addon.c -o /tmp/kcml-fd-cloexec.node
      - name: Regenerate implementation evidence
        run: pnpm contracts:build
      - name: Verify RUN-011 closure with diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/run011-verify.txt
          failed=0
          for command in \
            "pnpm contracts:check" \
            "pnpm lint" \
            "pnpm typecheck" \
            "pnpm exec vitest run tests/runtime-boundary/runtime-gateway.test.ts tests/runtime-boundary/ipc-multiplex.test.ts tests/runtime-boundary/matrix.test.ts" \
            "pnpm build" \
            "pnpm conformance:audit" \
            "git diff --check"
          do
            printf '\n===== %s =====\n' "$command" >> /tmp/run011-verify.txt
            bash -lc "$command" >> /tmp/run011-verify.txt 2>&1
            status=$?
            printf '\nEXIT=%s\n' "$status" >> /tmp/run011-verify.txt
            if [ "$status" -ne 0 ]; then failed=$status; break; fi
          done
          cat /tmp/run011-verify.txt
          if [ "$failed" -ne 0 ]; then
            cp /tmp/run011-verify.txt /tmp/run011-verify.saved
            git reset --hard HEAD
            mkdir -p .audit
            cp /tmp/run011-verify.saved .audit/run011-verify.txt
            git config user.name 'openai-remediation-bot'
            git config user.email 'openai-remediation-bot@users.noreply.github.com'
            git add .audit/run011-verify.txt
            git commit -m 'chore(audit): capture RUN-011 validation failure'
            git push origin HEAD:audit-remediation-2026-09-06
            exit "$failed"
          fi
      - name: Commit verified remediation
        shell: bash
        run: |
          git config user.name 'openai-remediation-bot'
          git config user.email 'openai-remediation-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(runtime): enforce socket-activated gateway identity'
          git push origin HEAD:audit-remediation-2026-09-06
