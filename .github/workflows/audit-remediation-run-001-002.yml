name: Audit remediation RUN-001 RUN-002
on:
  push:
    branches: [audit-remediation-2026-09-06]
    paths: ['.github/workflows/audit-remediation-run-001-002.yml']
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-2026-09-06
          fetch-depth: 0
      - name: Wire authoritative runtime host launch path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          host=Path('packages/worker-runtime/src/runtime-host.ts')
          t=host.read_text()
          t=t.replace("import { createHash, randomUUID } from 'node:crypto';", "import { createHash } from 'node:crypto';")
          t=t.replace("  readonly tools: readonly ToolContract[];\n}", "  readonly tools: readonly ToolContract[];\n  readonly runtime: GeneratedRuntimeManifest;\n}")
          t=t.replace("return { manifest, manifestDigest, releaseDirectory: row.release_directory, linuxUid: uid, linuxGid: gid, tools: parsed.tools };", "return { manifest, manifestDigest, releaseDirectory: row.release_directory, linuxUid: uid, linuxGid: gid, tools: parsed.tools, runtime: parsed.runtime };")
          t=t.replace("  const runtime: GeneratedRuntimeManifest = componentManifestSchema.parse((await inMemoryManifest(plan)).canonicalManifest).runtime;", "  const runtime = plan.runtime;")
          t=re.sub(r"\nasync function inMemoryManifest\(plan: RuntimeLaunchPlan\): Promise<\{ canonicalManifest: unknown \}> \{.*?\n\}\n\nasync function connectGateway", "\nasync function connectGateway", t, flags=re.S)
          old="""  await client.query(`INSERT INTO kcml.runtime_readiness_evidence(runtime_instance_id,runtime_generation,ready_sequence,check_kind,check_result,evidence,evidence_digest,observed_at,activation_epoch,platform_incarnation_id,application_deployment_epoch)\n    VALUES($1,$2,$3,'HANDLER_READY','PASS',$4,$5,clock_timestamp(),$6,$7,$8)`, [\n    plan.manifest.runtimeInstanceId, plan.manifest.runtimeGeneration, readySequence.toString(), processEvidence, Buffer.from(canonicalDigest(processEvidence).slice(7), 'hex'), plan.manifest.activationEpoch, plan.manifest.platformIncarnationId, plan.manifest.applicationDeploymentEpoch\n  ]);"""
          new="""  if (handler.process.exitCode !== null || handler.process.killed || handler.pidfd < 0) throw new Error('RUNTIME_HANDLER_NOT_LIVE_AT_READY');\n  const hostReady = await client.query(`UPDATE kcml.runtime_process_identity SET ready_at=coalesce(ready_at,clock_timestamp()),\n    pidfd_evidence=coalesce(pidfd_evidence,'{}'::jsonb) || $4::jsonb,state_version=state_version+1\n    WHERE runtime_instance_id=$1 AND runtime_generation=$2 AND process_role='HOST' AND invocation_id=$3 AND exited_at IS NULL`, [\n    plan.manifest.runtimeInstanceId, plan.manifest.runtimeGeneration, gateway.invocationId, { ...processEvidence, handlerSupervisorPidfdPinned:true, handlerConformance:handshake }\n  ]);\n  if (hostReady.rowCount !== 1) throw new Error('RUNTIME_HOST_READY_EVIDENCE_MISSING');"""
          if old not in t: raise SystemExit('runtime readiness evidence block not found')
          t=t.replace(old,new)
          host.write_text(t)

          boundary=Path('packages/runtime-boundary/src/index.ts')
          t=boundary.read_text()
          t=t.replace("  pid: number;\n  capabilitySocket: Socket;", "  pid: number;\n  pidfd: number;\n  capabilitySocket: Socket;")
          marker="""export function createAnonymousCapabilityPair(addonPath: string): { childFd: number; hostSocket: Socket } {\n  const addon = createRequire(import.meta.url)(addonPath) as { createSocketPair?: () => [number, number] };\n  const descriptors = addon.createSocketPair?.();"""
          replacement="""export function createAnonymousCapabilityPair(addonPath: string): { childFd: number; hostSocket: Socket } {\n  const addon = createRequire(import.meta.url)(addonPath) as { createSocketPair?: () => [number, number] };\n  const descriptors = addon.createSocketPair?.();"""
          if marker not in t: raise SystemExit('runtime boundary socketpair marker missing')
          # keep marker, add exact helper after function body
          helper="""\nfunction openSupervisorPidfd(addonPath: string, pid: number): number {\n  const addon = createRequire(import.meta.url)(addonPath) as { openPidfd?: (candidate: number) => number };\n  const pidfd = addon.openPidfd?.(pid);\n  if (!Number.isInteger(pidfd) || Number(pidfd) < 0) throw new Error('RUNTIME_PIDFD_TRACKING_FAILED');\n  return Number(pidfd);\n}\n"""
          anchor="""  const [hostFd, childFd] = descriptors;\n  return { childFd, hostSocket: new Socket({ fd: hostFd, readable: true, writable: true }) };\n}\n"""
          if helper.strip() not in t:
            if anchor not in t: raise SystemExit('runtime boundary helper anchor missing')
            t=t.replace(anchor,anchor+helper)
          old="""  if (pid <= 0) throw new Error('RUNTIME_SPAWN_FAILED');\n  return {\n    process: child,\n    pid,\n    capabilitySocket: capabilityPair.hostSocket,\n    terminate: async (signal = 'SIGTERM') => {\n      if (child.exitCode !== null) return;\n      child.kill(signal);\n      await new Promise<void>((done) => {\n        const timer = setTimeout(() => { child.kill('SIGKILL'); }, 10_000);\n        child.once('exit', () => { clearTimeout(timer); done(); });\n      });\n      capabilityPair.hostSocket.destroy();\n    }\n  };"""
          new="""  if (pid <= 0) throw new Error('RUNTIME_SPAWN_FAILED');\n  const addonPath = resolve(spec.releaseRoot, 'deploy/runtime/kcml-fd-cloexec.node');\n  let pidfd: number;\n  try { pidfd = openSupervisorPidfd(addonPath, pid); }\n  catch (error) { child.kill('SIGKILL'); capabilityPair.hostSocket.destroy(); throw error; }\n  let pidfdClosed = false;\n  const closePidfd = () => { if (!pidfdClosed) { pidfdClosed = true; closeSync(pidfd); } };\n  child.once('exit', closePidfd);\n  return {\n    process: child,\n    pid,\n    pidfd,\n    capabilitySocket: capabilityPair.hostSocket,\n    terminate: async (signal = 'SIGTERM') => {\n      if (child.exitCode === null) {\n        child.kill(signal);\n        await new Promise<void>((done) => {\n          const timer = setTimeout(() => { child.kill('SIGKILL'); }, 10_000);\n          child.once('exit', () => { clearTimeout(timer); done(); });\n        });\n      }\n      closePidfd();\n      capabilityPair.hostSocket.destroy();\n    }\n  };"""
          if old not in t: raise SystemExit('runtime boundary return block missing')
          t=t.replace(old,new)
          boundary.write_text(t)

          index=Path('packages/worker-runtime/src/index.ts')
          t=index.read_text()
          if "import { startRuntimeHost } from './runtime-host.js';" not in t:
            t=t.replace("import { startRuntimeGatewayServer } from './runtime-gateway.js';\n", "import { startRuntimeGatewayServer } from './runtime-gateway.js';\nimport { startRuntimeHost } from './runtime-host.js';\n")
          export_anchor="export { assertRuntimeGatewayActivationEnvironment, parseProcStartTicks, runtimeUnitFromCgroup, startRuntimeGatewayServer } from './runtime-gateway.js';\n"
          if "from './runtime-host.js'" not in t:
            t=t.replace(export_anchor, export_anchor+"export { buildRuntimeLaunchManifest, startRuntimeHost } from './runtime-host.js';\n")
          marker="""  let closeBroker: (() => Promise<void>) | null = null;\n  let closeRuntimeGateway: (() => Promise<void>) | null = null;\n  if (options.serviceName === 'kcml-runtime-gateway') {"""
          replacement="""  let closeBroker: (() => Promise<void>) | null = null;\n  let closeRuntimeGateway: (() => Promise<void>) | null = null;\n  let closeRuntimeHost: (() => Promise<void>) | null = null;\n  if (options.serviceName === 'kcml-runtime-host') {\n    const runtimeHost = await startRuntimeHost(pool, logger);\n    closeRuntimeHost = () => runtimeHost.close('SERVICE_SHUTDOWN');\n  }\n  if (options.serviceName === 'kcml-runtime-gateway') {"""
          if marker not in t: raise SystemExit('worker runtime service startup marker missing')
          t=t.replace(marker,replacement)
          t=t.replace("  await closeRuntimeGateway?.();\n  await closeBroker?.();", "  await closeRuntimeHost?.();\n  await closeRuntimeGateway?.();\n  await closeBroker?.();")
          index.write_text(t)

          package=Path('packages/worker-runtime/package.json')
          data=json.loads(package.read_text())
          data['dependencies']['@kcml/runtime-boundary']='workspace:*'
          data['dependencies']=dict(sorted(data['dependencies'].items()))
          package.write_text(json.dumps(data,separators=(',',':'))+'\n')

          trace_path=Path('contracts/traceability/artifact-trace-source-remediation.json')
          trace=json.loads(trace_path.read_text())
          by={r['repositoryPath']:r for r in trace['records']}
          source_requirements=[
            'KCML-REQ-POSTGRES-d50823c4db20d871cc29fcf084a9901ad9578dcbac83966f3e377b11b9fa65c2',
            'KCML-REQ-POSTGRES-2a213c316ec7c08a5749f3fa14e57ebbe4d110a376f4fa90619bf5778492884d',
            'KCML-REQ-RUNTIME-13a226a438feb3ecb999acc6a8cd32dbafcc3983c79bddb753c26aaea53612114'
          ]
          # correct copied requirement ID if registry uses the actual 15.3 atom id
          source_requirements[-1]='KCML-REQ-RUNTIME-13a226a438feb3ecb999acc6e2b196d93cc3fd13b501c1edbb76481b552a97ee'
          source_requirements += [
            'KCML-REQ-RUNTIME-570451223c7a193f435310a19277521d92745091538e309ffd02edb0121d237c',
            'KCML-REQ-RUNTIME-8994c669152d0aab1022513ee90b12503ee03368b3fd93abe3a623bc55a0ea52',
            'KCML-REQ-RUNTIME-ad7bfbf9c94d1ba80d0b7f5b67e933f427bebadd2dbafca9c87b3f59feb09c78',
            'KCML-REQ-RUNTIME-cf93a4a97a65f5658b7b7d2341c61c5e860195fa1f09afafb103c47fcb529b5e',
            'KCML-REQ-RUNTIME-e72ce9a3c678f40b689ebb0c1aa916cf4fcf2ba99f84d92370edca5d02b6804c'
          ]
          records=[
            {'repositoryPath':'packages/worker-runtime/src/runtime-host.ts','requirementIds':source_requirements,'operationIds':['OP-RUNTIME-PREPARE','OP-RUNTIME-INSTANCE-START','OP-RUNTIME-BOUNDARY-VERIFY'],'stateMachineIds':['SM-RUNTIME_INSTANCE'],'registryRecordIds':['RUNTIME_INSTANCE'],'testIds':['TEST_CASE:tests/runtime-boundary/runtime-host.test.ts#runtime-host-launch-manifest'],'releaseIds':[],'traceAnchors':[]},
            {'repositoryPath':'tests/runtime-boundary/runtime-host.test.ts','requirementIds':source_requirements,'operationIds':['OP-RUNTIME-PREPARE','OP-RUNTIME-INSTANCE-START','OP-RUNTIME-BOUNDARY-VERIFY'],'stateMachineIds':['SM-RUNTIME_INSTANCE'],'registryRecordIds':['RUNTIME_INSTANCE'],'testIds':['TEST_CASE:tests/runtime-boundary/runtime-host.test.ts#runtime-host-launch-manifest'],'releaseIds':[],'traceAnchors':[]}
          ]
          for record in records:
            if record['repositoryPath'] in by: by[record['repositoryPath']].update(record)
            else: trace['records'].append(record)
          trace['records'].sort(key=lambda r:r['repositoryPath'])
          trace_path.write_text(json.dumps(trace,separators=(',',':'))+'\n')

          writer=Path('scripts/lib/authority-writer-audit.mjs')
          t=writer.read_text()
          anchor="  ['packages/worker-runtime/src/runtime-gateway.ts', 'WRITER-RUNTIME'],\n"
          addition="  ['packages/worker-runtime/src/runtime-host.ts', 'WRITER-RUNTIME'],\n"
          if addition not in t:
            if anchor not in t: raise SystemExit('runtime writer authority anchor missing')
            t=t.replace(anchor,anchor+addition)
          writer.write_text(t)
          PY
          rm -f .github/workflows/audit-remediation-run-001-002.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Compile native runtime boundary
        shell: bash
        run: |
          node_root=$(dirname "$(dirname "$(command -v node)")")
          node_include="${node_root}/include/node"
          test -f "${node_include}/node_api.h"
          cc -O2 -Wall -Wextra -Werror -fPIC -shared -I"${node_include}" deploy/runtime/kcml-fd-cloexec-addon.c -o /tmp/kcml-fd-cloexec.node
      - name: Regenerate implementation evidence
        run: pnpm contracts:build
      - name: Verify RUN-001 RUN-002 batch
        shell: bash
        run: |
          set +e
          : > /tmp/run001002-verify.txt
          failed=0
          for command in \
            "pnpm contracts:check" \
            "pnpm lint" \
            "pnpm typecheck" \
            "pnpm exec vitest run tests/runtime-boundary/runtime-host.test.ts tests/runtime-boundary/runtime-gateway.test.ts tests/runtime-boundary/ipc-multiplex.test.ts tests/runtime-boundary/sandbox-contract.test.ts" \
            "pnpm build" \
            "pnpm conformance:audit" \
            "git diff --check"
          do
            printf '\n===== %s =====\n' "$command" >> /tmp/run001002-verify.txt
            bash -lc "$command" >> /tmp/run001002-verify.txt 2>&1
            status=$?
            printf '\nEXIT=%s\n' "$status" >> /tmp/run001002-verify.txt
            if [ "$status" -ne 0 ]; then failed=$status; break; fi
          done
          cat /tmp/run001002-verify.txt
          if [ "$failed" -ne 0 ]; then
            cp /tmp/run001002-verify.txt /tmp/run001002-verify.saved
            git reset --hard HEAD
            mkdir -p .audit
            cp /tmp/run001002-verify.saved .audit/run001002-verify.txt
            git config user.name 'openai-remediation-bot'
            git config user.email 'openai-remediation-bot@users.noreply.github.com'
            git add .audit/run001002-verify.txt
            git commit -m 'chore(audit): capture RUN-001 RUN-002 validation failure'
            git push origin HEAD:audit-remediation-2026-09-06
            exit "$failed"
          fi
      - name: Commit verified runtime host remediation
        shell: bash
        run: |
          git config user.name 'openai-remediation-bot'
          git config user.email 'openai-remediation-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(runtime): launch generated handler before readiness'
          git push origin HEAD:audit-remediation-2026-09-06
