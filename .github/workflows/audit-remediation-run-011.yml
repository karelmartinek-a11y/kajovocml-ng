name: Audit remediation RUN-011
on:
  push:
    branches: [audit-remediation-2026-09-06]
    paths: ['.github/workflows/audit-remediation-run-011.yml']
permissions:
  contents: write
jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation-2026-09-06
          fetch-depth: 0
      - name: Wire runtime gateway into canonical worker runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ipc=Path('packages/runtime-capability-ipc/src/index.ts')
          t=ipc.read_text()
          if "import { createRequire } from 'node:module';" not in t:
              t=t.replace("import { spawn } from 'node:child_process';\n", "import { spawn } from 'node:child_process';\nimport { createRequire } from 'node:module';\nimport { resolve } from 'node:path';\n")
          marker="export const RUNTIME_IPC_MAX_PENDING = 32;\n"
          insert=r'''

          export interface RuntimeSocketFdEvidence {
            readonly family: 'AF_UNIX' | 'OTHER';
            readonly socketType: 'SOCK_STREAM' | 'OTHER';
            readonly accepting: boolean;
            readonly nonBlocking: boolean;
            readonly closeOnExec: boolean;
            readonly device: bigint;
            readonly inode: bigint;
            readonly localPath: string;
          }

          interface NativeRuntimeFdAddon {
            setFdCloexec(fd: number): void;
            inspectSocketFd(fd: number): RuntimeSocketFdEvidence;
            openPidfd(pid: number): number;
          }

          let nativeRuntimeFdAddon: NativeRuntimeFdAddon | null = null;
          function runtimeFdAddon(): NativeRuntimeFdAddon {
            if (nativeRuntimeFdAddon) return nativeRuntimeFdAddon;
            const addonPath = process.env.KCML_NATIVE_FD_ADDON ?? resolve(process.cwd(), 'deploy/runtime/kcml-fd-cloexec.node');
            const loaded = createRequire(import.meta.url)(addonPath) as Partial<NativeRuntimeFdAddon>;
            if (typeof loaded.setFdCloexec !== 'function' || typeof loaded.inspectSocketFd !== 'function' || typeof loaded.openPidfd !== 'function') throw new Error('KCML_NATIVE_FD_ADDON_INVALID');
            nativeRuntimeFdAddon = loaded as NativeRuntimeFdAddon;
            return nativeRuntimeFdAddon;
          }

          export function sealAndInspectSocketFd(fd: number): RuntimeSocketFdEvidence {
            if (!Number.isInteger(fd) || fd < 0) throw new Error('RUNTIME_SOCKET_FD_INVALID');
            const native = runtimeFdAddon();
            native.setFdCloexec(fd);
            return native.inspectSocketFd(fd);
          }

          export function openPinnedPidfd(pid: number): number {
            if (!Number.isInteger(pid) || pid <= 0) throw new Error('RUNTIME_PEER_PID_INVALID');
            return runtimeFdAddon().openPidfd(pid);
          }
          '''
          if 'export interface RuntimeSocketFdEvidence' not in t:
              t=t.replace(marker, marker+insert)
          t=t.replace('function consumeRuntimeFrames(socket: Socket, onFrame: (frame: RuntimeFrame) => Promise<void>): void {', 'export function consumeRuntimeFrames(socket: Socket, onFrame: (frame: RuntimeFrame) => Promise<void>): void {')
          old="  let pending = Buffer.alloc(0);\n  let expectedSequence = 1;\n  socket.on('data', (chunk: Buffer) => {"
          new="  let pending = Buffer.alloc(0);\n  let expectedSequence = 1;\n  let handling = Promise.resolve();\n  socket.on('data', (chunk: Buffer) => {"
          t=t.replace(old,new)
          old2="      void onFrame({ frameType: header.frameType, flags: header.flags, sequence: header.sequence, payload }).catch((error: unknown) => socket.destroy(error instanceof Error ? error : new Error(String(error))));"
          new2="      const frame = { frameType: header.frameType, flags: header.flags, sequence: header.sequence, payload } as RuntimeFrame;\n      handling = handling.then(() => onFrame(frame)).catch((error: unknown) => { socket.destroy(error instanceof Error ? error : new Error(String(error))); });"
          t=t.replace(old2,new2)
          ipc.write_text(t)

          index=Path('packages/worker-runtime/src/index.ts')
          t=index.read_text()
          if "import { startRuntimeGatewayServer } from './runtime-gateway.js';" not in t:
              t=t.replace("import { RuntimeLifecycleExecutor } from './runtime-systemd.js';\n", "import { RuntimeLifecycleExecutor } from './runtime-systemd.js';\nimport { startRuntimeGatewayServer } from './runtime-gateway.js';\n")
          if "export { startRuntimeGatewayServer" not in t:
              t=t.replace("export { RuntimeLifecycleExecutor, RuntimeSystemdController, parseSystemdShow, runtimeHostUnit } from './runtime-systemd.js';\n", "export { RuntimeLifecycleExecutor, RuntimeSystemdController, parseSystemdShow, runtimeHostUnit } from './runtime-systemd.js';\nexport { assertRuntimeGatewayActivationEnvironment, parseProcStartTicks, runtimeUnitFromCgroup, startRuntimeGatewayServer } from './runtime-gateway.js';\n")
          old="  let closeBroker: (() => Promise<void>) | null = null;\n  if (options.broker) {"
          new="  let closeBroker: (() => Promise<void>) | null = null;\n  let closeRuntimeGateway: (() => Promise<void>) | null = null;\n  if (options.serviceName === 'kcml-runtime-gateway') {\n    const runtimeGateway = await startRuntimeGatewayServer(pool, logger);\n    closeRuntimeGateway = () => new Promise<void>((resolveClose, reject) => runtimeGateway.close((error) => error ? reject(error) : resolveClose()));\n  }\n  if (options.broker) {"
          if old not in t: raise SystemExit('runService broker marker missing')
          t=t.replace(old,new)
          t=t.replace("  await closeBroker?.();\n  await pool.end();", "  await closeRuntimeGateway?.();\n  await closeBroker?.();\n  await pool.end();")
          index.write_text(t)
          PY
          rm -f .github/workflows/audit-remediation-run-011.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile trusted native FD boundary
        run: |
          test -f /usr/include/node/node_api.h
          cc -O2 -Wall -Wextra -Werror -fPIC -shared -I/usr/include/node deploy/runtime/kcml-fd-cloexec-addon.c -o /tmp/kcml-fd-cloexec.node
      - name: Regenerate implementation evidence
        run: pnpm contracts:build
      - name: Verify RUN-011 closure
        run: |
          pnpm contracts:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run tests/runtime-boundary/runtime-gateway.test.ts tests/runtime-boundary/ipc-multiplex.test.ts tests/runtime-boundary/matrix.test.ts
          pnpm build
          pnpm conformance:audit
          git diff --check
      - name: Commit verified remediation
        shell: bash
        run: |
          git config user.name 'openai-remediation-bot'
          git config user.email 'openai-remediation-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(runtime): enforce socket-activated gateway identity'
          git push origin HEAD:audit-remediation-2026-09-06
